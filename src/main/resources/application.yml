spring:
  application:
    name: fx-service
  datasource:
    url: jdbc:h2:mem:fxdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true

logging:
  level:
    root: INFO
    com.quynh.fxservice: DEBUG

fx:
  api:
    key: 9ca00c6ae52fa21a145304f9